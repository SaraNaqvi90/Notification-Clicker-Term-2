<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Notification Clicker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #e0f2fe, #f9fafb);
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #4b5563;
      margin-bottom: 1.6rem;
      font-size: 0.98rem;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    button {
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, opacity 0.15s ease;
    }

    #enableBtn {
      background: #2563eb;
      color: #ffffff;
    }

    #enableBtn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #sendBtn {
      background: #f59e0b;
      color: #111827;
    }

    #sendBtn:hover:not(:disabled) {
      background: #d97706;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.2);
    }

    .status {
      font-size: 0.9rem;
      color: #4b5563;
    }

    .status strong {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Notification Clicker</h1>
    <p class="subtitle">Click “Enable Notifications” first, then “Send Notification”.</p>

    <div class="buttons">
      <button id="enableBtn">Enable Notifications</button>
      <button id="sendBtn">Send Notification</button>
    </div>

    <p class="status">
      Permission status: <strong id="perm">unknown</strong>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
